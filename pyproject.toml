[project]
name = "shootagent"
version = "0.1.0"
description = "An agent that QCs real-estate photo shoots against their exposure brackets, applies chat edits across the shoot, and cuts a listing reel."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10",
  "pillow>=10.3",
  "scikit-image>=0.24",
  "scipy>=1.13",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "anthropic>=0.40",
  "openai>=1.50",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Local GPU models: text-prompted boxes (Grounding DINO), masks (SAM 2.1), inpainting (big-lama TorchScript).
local = [
  "torch>=2.5",
  "torchvision>=0.20",
  "transformers>=4.56",
  "accelerate>=1.0",
  "huggingface-hub>=0.25",
]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
shootagent = "shootagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shootagent"]

[tool.uv]
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }
torchvision = { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Bug-catching rules only: syntax errors, undefined/unused names, mutable or call defaults, and re-raises
# that drop the cause. Ruff 0.17's broader defaults flag style choices the codebase makes on purpose.
select = ["E9", "F", "B006", "B008", "B904"]

[tool.pytest.ini_options]
testpaths = ["tests"]
